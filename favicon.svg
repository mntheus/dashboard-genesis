<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="corte"><rect width="100" height="100" rx="22.5"/></clipPath>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset=".55" stop-color="#101829"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="brilho" cx="32%" cy="22%" r="72%">
      <stop offset="0" stop-color="#5b8cff" stop-opacity=".40"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <g clip-path="url(#corte)">
    <rect width="100" height="100" fill="url(#fundo)"/>
    <rect width="100" height="100" fill="url(#brilho)"/>

    <!-- A trinca de ases: espada no alto, copas e ouros embaixo -->
    <g filter="url(#sombra)">
      <!-- espada (branca) -->
      <g transform="translate(31.5,9) scale(0.37)">
        <path fill="#f4f7ff" d="M50 8 C50 8 87 36 87 58 C87 72 77 81 66.5 81 C59.5 81 54.5 77 52.5 73 L59 93 L41 93 L47.5 73 C45.5 77 40.5 81 33.5 81 C23 81 13 72 13 58 C13 36 50 8 50 8 Z"/>
      </g>
      <!-- copas (vermelha) -->
      <g transform="translate(9,49) scale(0.345)">
        <path fill="#ef4e63" d="M50 89 C50 89 13 62 13 37.5 C13 21.5 26 11 38.5 11 C45.5 11 50 16.5 50 16.5 C50 16.5 54.5 11 61.5 11 C74 11 87 21.5 87 37.5 C87 62 50 89 50 89 Z"/>
      </g>
      <!-- ouros (vermelho) -->
      <g transform="translate(56.5,49) scale(0.345)">
        <path fill="#f87171" d="M50 7 L86 50 L50 93 L14 50 Z"/>
      </g>
    </g>
  </g>
</svg>
